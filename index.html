<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Været</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Været">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9EEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A20" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF0; --surface:#F7F9FA; --ink:#16232B; --muted:#5A6B75; --line:#CBD6DB;
  --plus:#C23B22; --minus:#1F6FB2; --rain:#3E86C6; --accent:#1F4E66;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1A20; --surface:#17252D; --ink:#E6EDF0; --muted:#93A4AD; --line:#2A3B44;
    --plus:#FF7A5C; --minus:#6CB2F0; --rain:#5AA2E0; --accent:#9FC7DA;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.4;font-variant-numeric:tabular-nums;
}
main{max-width:560px;margin:0 auto;padding:12px 18px 28px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Place switch */
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:6px 0 20px}
.switch button{border:0;background:none;padding:9px 0;border-radius:9px;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer}
.switch button[aria-selected="true"]{background:var(--accent);color:var(--surface)}

/* Now */
.now{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:16px}
.now .temp{font-size:96px;line-height:.9;font-weight:600;letter-spacing:-.04em}
.now .sym{font-size:64px;line-height:1;justify-self:end}
.now .desc{grid-column:1/-1;font-size:20px;font-weight:500;margin-top:10px}
.facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);margin-top:4px}
.arrow{display:inline-block;transition:none}
.plus{color:var(--plus)} .minus{color:var(--minus)}

h2{font-size:15px;font-weight:600;color:var(--muted);margin:30px 0 8px}

/* Hourly strip: the curve sits over the columns */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.strip{position:relative}
.strip svg{display:block}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:52px;text-align:center}
.col .h{font-size:13px;color:var(--muted)}
.col .e{font-size:22px;line-height:1.3}
.col .t{font-weight:600}
.col .p{font-size:12px;color:var(--rain);min-height:1.3em}

/* Days */
.days{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.days li{display:grid;grid-template-columns:1fr 34px 88px 58px;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
.days li:first-child{border-top:0}
.days .d{font-weight:500}
.days .e{font-size:22px;text-align:center}
.days .mm{text-align:right;font-weight:600}
.days .mm .lo{font-weight:400;margin-left:8px}
.days .r{text-align:right;color:var(--rain);font-size:14px}

.tides{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tides li{display:grid;grid-template-columns:26px 1fr auto auto;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.tides li:first-child{border-top:0}
.tides .ic{color:var(--rain);font-size:18px;text-align:center}
.tides .k{font-weight:500}
.tides .tt{font-weight:600;white-space:nowrap}
.tides .cm{color:var(--muted);min-width:64px;text-align:right}
.note{color:var(--muted);font-size:14px;margin:8px 2px 0}
footer{margin-top:24px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px}
.refresh{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;cursor:pointer}
.error{background:var(--surface);border:1px solid var(--plus);border-radius:12px;padding:12px 14px;margin-bottom:16px}
footer a{color:inherit}
.skeleton{color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<main>
  <div class="switch" role="tablist" aria-label="Sted">
    <button role="tab" data-id="trd">Trondheim</button>
    <button role="tab" data-id="olve">Ølve</button>
  </div>
  <div id="err"></div>
  <div id="view"><p class="skeleton">Henter varsel …</p></div>
  <footer>
    <div class="status"><span id="updated"></span><button class="refresh" id="refresh">Oppdater</button></div>
    <span>Data fra <a href="https://www.met.no/">MET Norway</a>, samme varsel som på <a href="https://www.yr.no/">yr.no</a>. Tidevann fra <a href="https://www.kartverket.no/til-sjos/se-havniva">Kartverket</a>. Lisens CC BY 4.0.</span>
  </footer>
</main>
<script>
(() => {
const PLACES = {
  trd:  { name: "Trondheim", lat: 63.43, lon: 10.50 },
  olve: { name: "Ølve",      lat: 60.01, lon: 5.81, tide: true }
};
const TZ = "Europe/Oslo";
const fHourNum = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", hourCycle: "h23", timeZone: TZ });
const fKey = new Intl.DateTimeFormat("sv-SE", { year: "numeric", month: "2-digit", day: "2-digit", timeZone: TZ });
const fDay = new Intl.DateTimeFormat("nb-NO", { weekday: "long", day: "numeric", timeZone: TZ });
const fClock = new Intl.DateTimeFormat("nb-NO", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
const hourOf = d => parseInt(fHourNum.format(d), 10);
const keyOf = d => fKey.format(d);

const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// symbol_code -> emoji + Norwegian text
function symbol(code){
  if (!code) return { e: "", t: "" };
  const night = /_night|_polartwilight/.test(code);
  const base = code.replace(/_(day|night|polartwilight)$/, "");
  const T = {
    clearsky:"Klarvær", fair:"Lettskyet", partlycloudy:"Delvis skyet", cloudy:"Skyet", fog:"Tåke",
    lightrain:"Lett regn", rain:"Regn", heavyrain:"Kraftig regn",
    lightrainshowers:"Lette regnbyger", rainshowers:"Regnbyger", heavyrainshowers:"Kraftige regnbyger",
    lightsleet:"Lett sludd", sleet:"Sludd", heavysleet:"Kraftig sludd",
    lightsleetshowers:"Lette sluddbyger", sleetshowers:"Sluddbyger", heavysleetshowers:"Kraftige sluddbyger",
    lightsnow:"Lett snø", snow:"Snø", heavysnow:"Kraftig snø",
    lightsnowshowers:"Lette snøbyger", snowshowers:"Snøbyger", heavysnowshowers:"Kraftige snøbyger"
  };
  let t = T[base.replace("andthunder","")] || "";
  if (base.includes("andthunder")) t = (t || "Nedbør") + " og torden";
  let e = "☁️";
  if (base.includes("thunder")) e = "⛈️";
  else if (base.includes("snow")) e = "🌨️";
  else if (base.includes("sleet")) e = "🌨️";
  else if (base.includes("showers")) e = night ? "🌧️" : "🌦️";
  else if (base.includes("rain")) e = "🌧️";
  else if (base === "fog") e = "🌫️";
  else if (base === "cloudy") e = "☁️";
  else if (base === "partlycloudy") e = night ? "☁️" : "⛅";
  else if (base === "fair") e = night ? "🌙" : "🌤️";
  else if (base === "clearsky") e = night ? "🌙" : "☀️";
  return { e, t };
}
const deg = v => { const r = Math.round(v); return `<span class="${r > 0 ? "plus" : r < 0 ? "minus" : ""}">${r}°</span>`; };
const mm = v => v.toLocaleString("nb-NO", { maximumFractionDigits: 1 });
const DIRS = ["nord","nordøst","øst","sørøst","sør","sørvest","vest","nordvest"];
const dirName = d => DIRS[Math.round(d / 45) % 8];

function process(json){
  const ts = json.properties.timeseries.map(x => ({ time: new Date(x.time), ...x.data }));
  const now = Date.now();
  // keep the current hour onwards
  const future = ts.filter(x => x.time.getTime() > now - 3600e3);
  const cur = future[0];

  const hourly = future.filter(x => x.next_1_hours).slice(0, 24).map(x => ({
    time: x.time, temp: x.instant.details.air_temperature,
    sym: x.next_1_hours.summary.symbol_code, rain: x.next_1_hours.details.precipitation_amount || 0
  }));

  // daily aggregation, precipitation counted once per period
  const days = new Map();
  let covered = 0;
  for (const x of future){
    const k = keyOf(x.time), t = x.time.getTime();
    if (!days.has(k)) days.set(k, { key: k, date: x.time, min: Infinity, max: -Infinity, rain: 0, cands: [] });
    const d = days.get(k);
    const temp = x.instant.details.air_temperature;
    d.min = Math.min(d.min, temp); d.max = Math.max(d.max, temp);
    if (t >= covered){
      if (x.next_1_hours){ d.rain += x.next_1_hours.details.precipitation_amount || 0; covered = t + 3600e3; }
      else if (x.next_6_hours){ d.rain += x.next_6_hours.details.precipitation_amount || 0; covered = t + 6 * 3600e3; }
    }
    const s6 = x.next_6_hours?.summary?.symbol_code, s1 = x.next_1_hours?.summary?.symbol_code;
    if (s6 || s1) d.cands.push({ h: hourOf(x.time), s: s6 || s1, six: !!s6 });
  }
  const list = [...days.values()].slice(0, 9).map(d => {
    // pick the period closest to midday, preferring 6-hour summaries
    let best = null, score = Infinity;
    for (const c of d.cands){ const sc = Math.abs(c.h - 12) + (c.six ? 0 : 0.5); if (sc < score){ score = sc; best = c; } }
    return { ...d, sym: best?.s };
  });
  return { cur, hourly, days: list };
}

function curve(hourly){
  const W = 52, H = 64, pad = 14, n = hourly.length;
  const temps = hourly.map(h => h.temp);
  let lo = Math.min(...temps), hi = Math.max(...temps);
  if (hi - lo < 4){ const m = (hi + lo) / 2; lo = m - 2; hi = m + 2; }
  const y = v => pad + (H - 2 * pad) * (1 - (v - lo) / (hi - lo));
  const pts = temps.map((t, i) => [i * W + W / 2, y(t)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++){
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
    d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  const dots = pts.map(([x, yy], i) => {
    const r = Math.round(temps[i]);
    const c = r > 0 ? "var(--plus)" : r < 0 ? "var(--minus)" : "var(--muted)";
    return `<circle cx="${x}" cy="${yy}" r="3" fill="${c}"/>`;
  }).join("");
  return `<svg width="${n * W}" height="${H}" viewBox="0 0 ${n * W} ${H}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(--muted)" stroke-opacity=".55" stroke-width="2"/>${dots}</svg>`;
}

function render(id, p){
  const { cur, hourly, days } = p;
  const s = symbol(cur.next_1_hours?.summary?.symbol_code || cur.next_6_hours?.summary?.symbol_code);
  const det = cur.instant.details;
  const nextRain = cur.next_1_hours?.details?.precipitation_amount;
  const todayKey = keyOf(new Date()), tomorrowKey = keyOf(new Date(Date.now() + 86400e3));
  const dayLabel = d => d.key === todayKey ? "I dag" : d.key === tomorrowKey ? "I morgen" :
    fDay.format(d.date).replace(/^./, c => c.toUpperCase()).replace(".", "");

  document.getElementById("view").innerHTML = `
    <section class="now" aria-label="Været nå i ${PLACES[id].name}">
      <div class="temp">${deg(det.air_temperature)}</div>
      <div class="sym" aria-hidden="true">${s.e}</div>
      <div class="desc">${s.t}</div>
      <div class="facts">
        <span><span class="arrow" style="transform:rotate(${(det.wind_from_direction + 180) % 360}deg)" aria-hidden="true">↑</span>
          ${Math.round(det.wind_speed)} m/s fra ${dirName(det.wind_from_direction)}</span>
        ${nextRain != null ? `<span>${nextRain > 0 ? mm(nextRain) + " mm neste time" : "Opphold neste time"}</span>` : ""}
      </div>
    </section>
    <h2>Neste 24 timer</h2>
    <div class="scroller"><div class="strip" style="width:${hourly.length * 52}px">
      ${curve(hourly)}
      <div class="cols">${hourly.map(h => {
        const sy = symbol(h.sym);
        return `<div class="col"><div class="t">${deg(h.temp)}</div><div class="e" title="${sy.t}">${sy.e}</div>
          <div class="p">${h.rain > 0 ? mm(h.rain) : ""}</div><div class="h">${String(hourOf(h.time)).padStart(2, "0")}</div></div>`;
      }).join("")}</div>
    </div></div>
    ${PLACES[id].tide ? `<h2>Tidevann neste døgn</h2><div id="tide"><p class="note">Henter tidevann …</p></div>` : ""}
    <h2>De neste dagene</h2>
    <ul class="days">${days.map(d => {
      const sy = symbol(d.sym);
      return `<li><span class="d">${dayLabel(d)}</span><span class="e" title="${sy.t}">${sy.e}</span>
        <span class="mm">${deg(d.max)}<span class="lo">${deg(d.min)}</span></span>
        <span class="r">${d.rain >= 0.05 ? mm(d.rain) + " mm" : ""}</span></li>`;
    }).join("")}</ul>`;
  if (PLACES[id].tide){ const c = store.get("tide:" + id); if (c) renderTide(c.events); }
}

// ---- Tidevann (Kartverket), kun for steder med tide: true ----
const TIDE_POINTS = [[60.01, 5.81], [60.00, 5.80], [59.99, 5.80], [60.00, 5.83], [60.02, 5.79]];
const fTideTime = new Intl.DateTimeFormat("nb-NO", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
function tideUrl(lat, lon){
  // tzone=1 uses norsk normaltid in the request window; pad the window generously
  const from = new Date(Date.now() + 3600e3 - 3 * 3600e3).toISOString().slice(0, 16);
  const to = new Date(Date.now() + 3600e3 + 34 * 3600e3).toISOString().slice(0, 16);
  return `https://vannstand.kartverket.no/tideapi.php?tide_request=locationdata&lat=${lat}&lon=${lon}` +
    `&fromtime=${from}&totime=${to}&datatype=tab&refcode=cd&lang=nb&interval=60&dst=1&tzone=1`;
}
function parseTide(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const wl = [...doc.querySelectorAll("waterlevel")].map(n => ({
    time: new Date(n.getAttribute("time")), value: parseFloat(n.getAttribute("value")),
    flag: (n.getAttribute("flag") || "").toLowerCase()
  })).filter(x => !isNaN(x.time) && !isNaN(x.value)).sort((a, b) => a.time - b.time);
  // classify high/low from flag, or from neighbours if the flag is missing
  wl.forEach((x, i) => {
    if (x.flag.includes("high")) x.kind = "high";
    else if (x.flag.includes("low")) x.kind = "low";
    else { const o = wl[i + 1] || wl[i - 1]; x.kind = o && x.value > o.value ? "high" : "low"; }
  });
  return wl;
}
async function fetchTide(){
  for (const [lat, lon] of TIDE_POINTS){
    const res = await fetch(tideUrl(lat, lon));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const events = parseTide(await res.text());
    if (events.length) return events.map(e => ({ t: e.time.getTime(), v: e.value, k: e.kind }));
  }
  throw new Error("nodata");
}
function renderTide(events){
  const el = document.getElementById("tide");
  if (!el) return;
  const now = Date.now();
  const future = events.filter(e => e.t > now);
  const highs = future.filter(e => e.k === "high").slice(0, 2);
  const lows = future.filter(e => e.k === "low").slice(0, 2);
  const list = [...highs, ...lows].sort((a, b) => a.t - b.t);
  if (list.length < 4 && !future.length){ el.innerHTML = '<p class="note">Fant ikke tidevann for de neste timene. Trykk Oppdater.</p>'; return; }
  const todayKey = keyOf(new Date());
  el.innerHTML = `<ul class="tides">${list.map(e => {
    const d = new Date(e.t), day = keyOf(d) === todayKey ? "I dag" : "I morgen";
    return `<li><span class="ic" aria-hidden="true">${e.k === "high" ? "▲" : "▼"}</span>
      <span class="k">${e.k === "high" ? "Høyvann" : "Lavvann"}</span>
      <span class="tt">${day} ${fTideTime.format(d)}</span><span class="cm">${Math.round(e.v)} cm</span></li>`;
  }).join("")}</ul><p class="note">Høyde over sjøkartnull, som i tidevannstabellene.</p>`;
}
async function loadTide(id, force){
  if (!PLACES[id].tide) return;
  const cached = store.get("tide:" + id);
  const fresh = cached && Date.now() - cached.ts < 3 * 3600e3 &&
    cached.events.filter(e => e.t > Date.now()).length >= 4;
  if (cached) renderTide(cached.events);
  if (fresh && !force) return;
  try {
    const events = await fetchTide();
    store.set("tide:" + id, { ts: Date.now(), events });
    if (id === current) renderTide(events);
  } catch (e) {
    if (id === current && !cached){
      const el = document.getElementById("tide");
      if (el) el.innerHTML = '<p class="note">Fikk ikke hentet tidevann fra Kartverket. Trykk Oppdater for å prøve igjen.</p>';
    }
  }
}

let current = store.get("wx:place") || "trd";
if (!PLACES[current]) current = "trd";

function showUpdated(ts){
  document.getElementById("updated").textContent = ts ? `Oppdatert kl. ${fClock.format(new Date(ts))}` : "";
}
function showError(msg){ document.getElementById("err").innerHTML = msg ? `<div class="error" role="alert">${msg}</div>` : ""; }

async function load(id, force){
  const cached = store.get("wx:" + id);
  if (cached){ try { render(id, process(cached.data)); showUpdated(cached.ts); } catch {} }
  else { document.getElementById("view").innerHTML = '<p class="skeleton">Henter varsel …</p>'; showUpdated(); }
  if (!force && cached && Date.now() - cached.ts < 10 * 60e3) { showError(); return; }
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "Oppdaterer …";
  try {
    const { lat, lon } = PLACES[id];
    const res = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat}&lon=${lon}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const entry = { ts: Date.now(), data };
    store.set("wx:" + id, entry);
    if (id === current){ render(id, process(data)); showUpdated(entry.ts); showError(); }
  } catch (e) {
    if (id === current) showError(cached
      ? "Fikk ikke hentet nytt varsel. Du ser det sist lagrede. Sjekk nettforbindelsen og trykk Oppdater."
      : "Fikk ikke hentet varselet. Sjekk nettforbindelsen og trykk Oppdater.");
  } finally { btn.disabled = false; btn.textContent = "Oppdater"; }
}

function select(id){
  current = id; store.set("wx:place", id);
  document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-selected", b.dataset.id === id));
  load(id).then(() => loadTide(id));
}
document.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => select(b.dataset.id)));
document.getElementById("refresh").addEventListener("click", () => load(current, true).then(() => loadTide(current, true)));
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(current).then(() => loadTide(current)); });
select(current);
})();
</script>
</body>
</html>
